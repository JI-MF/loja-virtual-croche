name: CI - Producoes da Vick Croche

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verificar:
    name: Verificar aplicacao
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/croche_ci
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: ci
      DB_PASSWORD: ci
      DB_NAME: croche_ci

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar cliente Prisma
        run: npx prisma generate

      - name: Executar lint
        run: npm run lint

      - name: Compilar aplicacao
        run: npm run build
