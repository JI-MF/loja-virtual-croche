services:
  mysql:
    image: mysql:8.4
    container_name: croche-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${DB_NAME:-croche}
      MYSQL_USER: ${DB_USER:?Defina DB_USER no .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - croche_network

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u root -p"$${MYSQL_ROOT_PASSWORD}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate

    container_name: croche-migrate

    restart: "no"

    env_file:
      - .env

    environment:
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@mysql:3306/${DB_NAME:-croche}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-croche}

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - croche_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner

    container_name: croche-app

    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production

      APP_URL: ${APP_URL:-http://localhost:3000}

      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@mysql:3306/${DB_NAME:-croche}

      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-croche}

    ports:
      - "3000:3000"

    depends_on:
      migrate:
        condition: service_completed_successfully

    networks:
      - croche_network

volumes:
  mysql_data:

networks:
  croche_network:
    driver: bridge
